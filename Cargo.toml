[package]
name = "hive-cpp"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Native Rust port of the Hive agent memory + context compression stack"
license = "MIT"
repository = "https://github.com/DJLougen/hive"
readme = "README.md"
keywords = ["agent", "memory", "context-compression", "honeycomb", "busybee", "hive", "nvidia", "jetson", "grace", "edge-ai"]
categories = ["api-bindings", "data-structures", "concurrency"]

[lib]
name = "hive"
crate-type = ["rlib", "staticlib", "cdylib"]
path = "src/lib.rs"

[[bin]]
name = "hive-bench"
path = "src/bin/hive_bench.rs"

[[bin]]
name = "hive-server"
path = "src/bin/hive_server.rs"

[dependencies]
parking_lot = "0.12"
once_cell = "1.19"
thiserror = "1.0"
anyhow = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ahash = "0.8"
smallvec = "1.13"
regex = "1.10"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"

[features]
default = []
cuda = []
nvidia-ml = []
honeycomb-compat = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
debug = false
