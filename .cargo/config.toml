# .cargo/config.toml — local Cargo config for hive-cpp.
#
# The `[target.aarch64-linux-android]` block is the only one the
# default x86 dev box needs; add the Jetson / Grace / Orin
# block when the cross-build is wired up.
#
# This file is checked in so the CI matrix picks it up.

[target.aarch64-linux-android]
# Default to a placeholder; the actual NDK path differs per host.
# Override via `CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER` in CI.
#
# Windows NDK:  $env:ANDROID_NDK_HOME = "C:\Android\ndk\27.0.11718014"
#               $env:CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER = "$env:ANDROID_NDK_HOME\toolchains\llvm\prebuilt\windows-x86_64\bin\clang.exe"
# Linux NDK:    CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=/opt/android-ndk-r27/toolchains/llvm/prebuilt/linux-x86_64/bin/clang
linker = "clang"
ar = "llvm-ar"

# Jetson Thor / Grace / Orin. Same toolchain as Ubuntu/Debian
# aarch64 cross-builds.
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
ar = "aarch64-linux-gnu-ar"

# Raspberry Pi 5 (musl, no glibc dependency).
[target.aarch64-unknown-linux-musl]
linker = "aarch64-linux-musl-gcc"
